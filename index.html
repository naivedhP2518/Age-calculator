<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Age Calculator - Modern & Accurate</title>
    <meta
      name="description"
      content="Calculate your exact age in years, months, and days with our modern, glassmorphic age calculator."
    />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="background-blobs">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
    </div>

    <main class="container">
      <div class="glass-card">
        <header>
          <h1>Age Calculator</h1>
          <p>Enter your birth date to find your exact age.</p>
        </header>

        <div class="input-section">
          <div class="input-row">
            <div class="input-field">
              <label for="day">Day</label>
              <input type="number" id="day" placeholder="DD" min="1" max="31" required />
            </div>
            <div class="input-field">
              <label for="month">Month</label>
              <input type="number" id="month" placeholder="MM" min="1" max="12" required />
            </div>
            <div class="input-field">
              <label for="year">Year</label>
              <input type="number" id="year" placeholder="YYYY" min="1900" max="2026" required />
            </div>
            <div class="input-field calendar-trigger-field">
              <button id="calendar-toggle" class="icon-btn" title="Open Calendar">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                  <line x1="16" y1="2" x2="16" y2="6"></line>
                  <line x1="8" y1="2" x2="8" y2="6"></line>
                  <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
              </button>
            </div>
          </div>
          <button id="calculate-btn" class="primary-btn">Calculate Age</button>
        </div>

            <!-- Custom Calendar Modal -->
            <div id="calendar-modal" class="calendar-modal hidden">
                <div class="calendar-content glass-card">
                    <div class="calendar-view" id="calendar-date-view">
                        <div class="calendar-header">
                            <button id="prev-month" class="nav-btn">&lt;</button>
                            <h2 id="calendar-month-year" class="clickable-header">Month Year</h2>
                            <button id="next-month" class="nav-btn">&gt;</button>
                        </div>
                        <div class="calendar-weekdays">
                            <div>Su</div><div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div>Sa</div>
                        </div>
                        <div id="calendar-days" class="calendar-days"></div>
                    </div>

                    <!-- Month Selection View -->
                    <div class="calendar-view hidden" id="calendar-month-view">
                        <div class="calendar-header">
                            <button class="nav-btn visibility-hidden">&lt;</button>
                            <h2>Select Month</h2>
                            <button class="nav-btn visibility-hidden">&gt;</button>
                        </div>
                        <div id="calendar-months-grid" class="selection-grid"></div>
                    </div>

                    <!-- Year Selection View -->
                    <div class="calendar-view hidden" id="calendar-year-view">
                        <div class="calendar-header">
                            <h2>Select Year</h2>
                        </div>
                        <div id="calendar-years-grid" class="selection-list"></div>
                    </div>

                    <div class="calendar-footer">
                        <button id="calendar-today" class="text-btn">Today</button>
                        <button id="calendar-close" class="text-btn">Close</button>
                    </div>
                </div>
            </div>


        <div id="result" class="result-container hidden">
          <div class="main-result">
            <div class="result-box">
              <span id="years">0</span>
              <p>Years</p>
            </div>
            <div class="result-box">
              <span id="months">0</span>
              <p>Months</p>
            </div>
            <div class="result-box">
              <span id="days">0</span>
              <p>Days</p>
            </div>
          </div>

          <div class="detailed-stats">
            <div class="stat-item">
              <span class="stat-label">Total Months:</span>
              <span id="total-months" class="stat-value">0</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">Total Weeks:</span>
              <span id="total-weeks" class="stat-value">0</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">Total Days:</span>
              <span id="total-days" class="stat-value">0</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">Total Hours:</span>
              <span id="total-hours" class="stat-value">0</span>
            </div>
          </div>

          <div class="next-birthday">
            <p>
              Next birthday in
              <span id="next-birthday-countdown">...</span> days!
            </p>
          </div>
        </div>

        <div id="error-message" class="error hidden">
          Please select a valid date in the past.
        </div>
      </div>
    </main>

    <script src="assets/js/script.js"></script>
  </body>
</html>
